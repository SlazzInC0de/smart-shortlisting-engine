name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber numpy pytest pytest-cov
      - name: Tests with coverage
        shell: bash
        run: |
          pytest -v --cov=keyword_match --cov=bias_check --cov=scoring --cov=explain --cov=parsing \
            --cov-report=term-missing | tee pytest-output.txt
      - name: Publish coverage
        if: always()
        run: |
          { echo "## Coverage"; echo '```'; sed -n '/coverage:/,/TOTAL/p' pytest-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
