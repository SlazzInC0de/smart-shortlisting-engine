name: Screenshot (temporary)

on:
  push:
    branches: [ci/screenshot]

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Run app and capture
        run: |
          (streamlit run app.py --server.headless true --server.port 8501 > app.log 2>&1 &)
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1440, "height": 900})
              for _ in range(60):
                  try:
                      pg.goto("http://localhost:8501", timeout=5000); break
                  except Exception:
                      time.sleep(3)
              pg.wait_for_selector("text=Smart Shortlisting Engine", timeout=300000)
              time.sleep(60)
              pg.screenshot(path="docs/dashboard.png")
              pg.screenshot(path="docs/dashboard_full.png", full_page=True)
              b.close()
          PY
          tail -20 app.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard*.png
          git commit -m "docs: dashboard screenshots [skip ci]" && git push
